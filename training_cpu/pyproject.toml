[project]
name = "cheetah-pup-cpu-smoke"
version = "0.1.0"
description = "Bounded CPU PPO experiment using the original Cheetah Pup assembly and pinned BAM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "stable-baselines3==2.7.1",
  "gymnasium==1.2.3",
  "torch==2.9.1+cpu",
  "mujoco==3.10.0",
  "numpy==2.4.1",
  "colorama==0.4.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
