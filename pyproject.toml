[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cheetah-pup"
version = "0.1.0"
description = "Original miniature quadruped geometry and simulation workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "mujoco==3.10.0",
  "numpy==2.4.1",
  "pillow==12.1.0",
  "matplotlib==3.10.9",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
cheetah-pup = "cheetah_pup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cheetah_pup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
